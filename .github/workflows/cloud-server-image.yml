name: Build AI Interpreter CUDA Server

on:
  workflow_dispatch:
  push:
    paths:
      - "CloudServer/**"
      - ".github/workflows/cloud-server-image.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: cloud-server-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free runner disk for CUDA image and resident models
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/ai-interpreter-server
          tags: |
            type=raw,value=prototype
            type=sha,prefix=sha-
      - uses: imjasonh/setup-crane@v0.4
      - name: Check for an existing resident-model image
        id: resident-image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/ai-interpreter-server
        run: |
          if crane digest "${IMAGE}:prototype" --platform linux/amd64 >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Apply source overlay without downloading model layers
        if: steps.resident-image.outputs.exists == 'true'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/ai-interpreter-server
        run: |
          set -euo pipefail
          overlay="${RUNNER_TEMP}/tts-overlay"
          mkdir -p "${overlay}/srv/ai-interpreter/app"
          mkdir -p "${overlay}/srv/ai-interpreter/scripts"
          cp CloudServer/app/main.py "${overlay}/srv/ai-interpreter/app/main.py"
          cp CloudServer/app/settings.py "${overlay}/srv/ai-interpreter/app/settings.py"
          cp CloudServer/app/tts.py "${overlay}/srv/ai-interpreter/app/tts.py"
          cp CloudServer/app/tts_jobs.py "${overlay}/srv/ai-interpreter/app/tts_jobs.py"
          cp CloudServer/scripts/start-server.sh "${overlay}/srv/ai-interpreter/scripts/start-server.sh"
          chmod 755 "${overlay}/srv/ai-interpreter/scripts/start-server.sh"
          tar -C "${overlay}" -czf "${RUNNER_TEMP}/tts-overlay.tar.gz" .

          overlay_tag="overlay-${GITHUB_SHA}"
          sha_tag="sha-${GITHUB_SHA::7}"
          crane mutate "${IMAGE}:prototype" \
            --platform linux/amd64 \
            --append "${RUNNER_TEMP}/tts-overlay.tar.gz" \
            --env AI_INTERPRETER_SERVICE_MODE=tts \
            --tag "${IMAGE}:${overlay_tag}"
          crane tag "${IMAGE}:${overlay_tag}" prototype
          crane tag "${IMAGE}:${overlay_tag}" "${sha_tag}"
      - uses: docker/build-push-action@v6
        id: image-build
        if: steps.resident-image.outputs.exists != 'true'
        with:
          context: .
          file: CloudServer/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/ai-interpreter-server:prototype
          cache-to: type=inline
