name: Build AI Interpreter CUDA Server

on:
  workflow_dispatch:
  push:
    paths:
      - "CloudServer/**"
      - ".github/workflows/cloud-server-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free runner disk for CUDA image and resident models
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/ai-interpreter-server
          tags: |
            type=raw,value=prototype
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: CloudServer/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/ai-interpreter-server:prototype
